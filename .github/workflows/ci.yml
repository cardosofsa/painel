# CI (Fase 5, onda D): as mesmas checagens que o CLAUDE.md pede antes de dar algo por
# pronto, a cada push e PR. Nenhum segredo é usado: os testes de banco rodam no PGlite e o
# E2E roda contra o build de produção com um Supabase falso (que recusa conexão).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # As checagens rodam em jobs paralelos (antes eram um job só, em sequência: lint, tipos,
  # testes 2×, e os testes de banco no PGlite, que sozinhos levam alguns minutos). O que é
  # checado é o mesmo; o tempo total passa a ser o do job mais lento.
  lint-tipos:
    name: Lint e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: npx tsc --noEmit

  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test

  testes-fuso:
    name: Testes com fuso de Brasília
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
        env:
          TZ: America/Sao_Paulo

  # Cada script de banco sobe o próprio PGlite e reaplica todas as migrações (~7 s), e são
  # ~45: em fila passavam de 10 min. `rodar-todos.mjs` roda em paralelo dentro do runner, e a
  # matriz divide em 3 fatias, cada uma em seu runner.
  testes-banco:
    name: Testes de banco (PGlite) ${{ matrix.fatia }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run test:sql -- --fatia=${{ matrix.fatia }}/3

  e2e:
    name: E2E (páginas públicas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:59999
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-teste-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
